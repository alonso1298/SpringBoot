<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Habilidades</title>
</head>
<body>
    <h1>Agregar nueva habilidad</h1>
    <!--Con @ indicamos las rutas-->
    <form th:action="@{/skills/add}" th:object="${skill}" method="post">
        <label th:for="nombre">Nombre</label>
        <input type="text">
        <!--como se esta trabajando con post se convierte el button en tipo submint-->
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
